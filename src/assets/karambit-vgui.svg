<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g shape-rendering="crispEdges">
    <!-- Marco exterior 1px negro -->
    <rect x="0" y="0" width="64" height="64" fill="#000000" />
    <!-- Fondo exterior verde VGUI (var bg #4a5942) -->
    <rect x="1" y="1" width="62" height="62" fill="#4a5942" />
    <!-- Bisel exterior luz (var border-light #8c9284) -->
    <rect x="1" y="1" width="62" height="2" fill="#8c9284" />
    <rect x="1" y="1" width="2" height="62" fill="#8c9284" />
    <!-- Bisel exterior sombra (var border-dark #292c21) -->
    <rect x="1" y="61" width="62" height="2" fill="#292c21" />
    <rect x="61" y="1" width="2" height="62" fill="#292c21" />
    <!-- Panel interior empotrado (var secondary-bg #3e4637) -->
    <rect x="5" y="5" width="54" height="54" fill="#3e4637" />
    <!-- Bisel interior sombra (var border-dark #292c21) -->
    <rect x="5" y="5" width="54" height="1" fill="#292c21" />
    <rect x="5" y="5" width="1" height="54" fill="#292c21" />
    <!-- Bisel interior luz (var border-light #8c9284) -->
    <rect x="5" y="58" width="54" height="1" fill="#8c9284" />
    <rect x="58" y="5" width="1" height="54" fill="#8c9284" />
  </g>
  <g id="karambit" transform="translate(32, 32) rotate(15) scale(-1, 1) scale(0.75) translate(-20.9, -32.25)">
    <!-- Anillo con orificio calado (var accent #c4b550) -->
    <path fill-rule="evenodd"
          d="M 11.0 15.5
             C 13.8 14.2, 14.4 11.8, 14.4 9.0
             C 14.4 5.8, 13.0 3.2, 10.5 2.0
             C 8.5 1.0, 6.5 1.0, 5.2 1.8
             L 4.0 0.5
             L 3.5 3.2
             C 1.8 4.8, 0.8 6.8, 0.8 9.2
             C 0.8 12.0, 1.8 14.5, 2.2 15.5
             Z
             M 7.8 13.2
             C 5.4 13.2, 3.5 11.5, 3.5 9.4
             C 3.5 7.3, 5.4 5.6, 7.8 5.6
             C 10.2 5.6, 12.2 7.3, 12.2 9.4
             C 12.2 11.5, 10.2 13.2, 7.8 13.2
             Z"
          fill="#c4b550" stroke="#292c21" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Empunadura tactica (var border-dark #292c21) -->
    <path d="M 16.5 38.5
             L 17.2 36.5
             C 17.0 35.5, 14.5 34.5, 12.5 33.8
             C 10.0 33.0, 8.8 32.2, 8.8 31.2
             C 8.8 30.0, 10.0 28.8, 11.0 28.0
             C 9.8 27.2, 8.8 26.2, 8.8 25.2
             C 8.8 24.0, 10.0 22.8, 11.0 22.0
             C 9.8 21.2, 8.8 20.2, 8.8 19.2
             C 8.8 17.8, 10.2 16.5, 11.2 15.5
             L 2.2 15.5
             C 1.2 18.5, 0.8 22.0, 0.8 26.5
             C 0.8 31.0, 1.2 35.0, 2.5 38.5
             Z"
          fill="#292c21" stroke="#292c21" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Estrias antideslizantes (var border-light #8c9284) -->
    <line x1="4.0" y1="21.0" x2="8.0" y2="21.0" stroke="#8c9284" stroke-width="1.0" />
    <line x1="4.0" y1="26.0" x2="8.0" y2="26.0" stroke="#8c9284" stroke-width="1.0" />
    <line x1="4.0" y1="31.0" x2="8.0" y2="31.0" stroke="#8c9284" stroke-width="1.0" />

    <!-- Lomo biselado (var secondary-accent #958831) -->
    <path d="M 41.0 62.0
             C 37.5 63.2, 33.5 64.0, 29.5 64.0
             C 24.5 64.0, 19.0 62.2, 14.5 59.5
             C 10.5 57.0, 6.5 52.5, 4.0 48.0
             C 2.5 45.2, 1.5 42.0, 2.0 39.0
             L 5.0 41.2
             C 7.5 46.5, 12.0 52.5, 17.0 56.5
             C 23.0 60.8, 30.5 62.5, 41.0 62.0
             Z"
          fill="#958831" stroke="#292c21" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Cara principal de la hoja (var accent #c4b550) -->
    <path d="M 41.0 62.0
             C 30.5 62.5, 23.0 60.8, 17.0 56.5
             C 12.0 52.5, 7.5 46.5, 5.0 41.2
             L 14.5 39.2
             L 17.0 41.2
             C 17.2 44.0, 18.5 48.5, 21.5 52.8
             C 25.0 56.5, 29.5 59.2, 34.0 60.8
             C 37.0 61.8, 39.2 62.0, 41.0 62.0
             Z"
          fill="#c4b550" stroke="#292c21" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Filo afilado de navaja (var button-text #ffffff) -->
    <path d="M 41.0 62.0
             C 39.2 62.0, 37.0 61.8, 34.0 60.8
             C 29.5 59.2, 25.0 56.5, 21.5 52.8
             C 18.5 48.5, 17.2 44.0, 17.0 41.2"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>